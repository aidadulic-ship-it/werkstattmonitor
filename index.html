<style>

<body>
<div id="app"></div>
<script>
// Minimaler Ersatz für die Prototyp-Laufzeit: setState rendert neu.
class DCLogic { constructor(props) { this.props = props || {}; this.state = {}; } setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); zeichnen(); } }
// ===== Statuslogik und Demo-Daten (identisch mit dem geprüften Prototyp) =====

class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    const jetzt = Date.now();
    const daten = this.demoDaten(this.heute());
    this.state = Object.assign({}, this.state || {}, {
      quelle: daten, anzeige: this.klon(daten), letzterSync: jetzt, letzterVersuch: jetzt, jetzt: jetzt,
      verbindung: true, ansicht: 'tv', detail: null, suche: '', fTech: '', fTyp: '', fKunde: '', fStatus: 'aktiv',
      simTech: 'M. Huber', geaendert: null, seitenTick: 0,
      log: [{ zeit: this.uhr(jetzt), text: 'Demo gestartet – synthetische Testdaten geladen', fehler: false }]
    });
  }
  componentDidMount() { this.timer = setInterval(() => this.tick(), 1000); }
  componentWillUnmount() { clearInterval(this.timer); }

  // ===== Konfiguration =====
  cfg() {
    const p = this.props || {};
    return {
      heute: this.heute(),
      kundeAufTv: p.kundeAufTv ?? true,
      karten: {
        rot: Math.max(1, p.kartenRot ?? 8),
        orange: Math.max(1, p.kartenOrange ?? 8),
        gruen: Math.max(1, p.kartenGruen ?? 12)
      },
      seitenwechselSek: Math.max(5, p.seitenwechselSek ?? 15),
      gruenAnzeigeTage: Math.max(0, p.gruenAnzeigeTage ?? 7),
      syncIntervallSek: Math.max(5, p.syncIntervallSek ?? 30),
      statusZuordnung: this.statusZuordnung()
    };
  }
  // DEMO-Platzhalter: echte CRM-Statuswerte werden im Live-Betrieb hier eingetragen.
  statusZuordnung() {
    return {
      servicemeldung: { 'Aktiv': 'offen', 'Gelöst': 'geschlossen', 'Storniert': 'storniert' },
      dispatch: { 'Zugewiesen': 'offen', 'In Arbeit': 'offen', 'Warten auf Freigabe': 'offen', 'Abgeschlossen': 'geschlossen', 'Storniert': 'storniert' }
    };
  }

  // ===== Hilfsfunktionen =====
  klon(o) { return JSON.parse(JSON.stringify(o)); }
  zwei(n) { return String(n).padStart(2, '0'); }
  heute() { const d = new Date(); return d.getFullYear() + '-' + this.zwei(d.getMonth() + 1) + '-' + this.zwei(d.getDate()); }
  uhr(ms) { const d = new Date(ms); return this.zwei(d.getHours()) + ':' + this.zwei(d.getMinutes()) + ':' + this.zwei(d.getSeconds()); }
  istDatum(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  tageZwischen(von, bis) {
    const a = von.split('-').map(Number), b = bis.split('-').map(Number);
    return Math.round((Date.UTC(b[0], b[1] - 1, b[2]) - Date.UTC(a[0], a[1] - 1, a[2])) / 86400000);
  }
  minusTage(datum, n) {
    const p = datum.split('-').map(Number);
    const d = new Date(Date.UTC(p[0], p[1] - 1, p[2] - n));
    return d.getUTCFullYear() + '-' + this.zwei(d.getUTCMonth() + 1) + '-' + this.zwei(d.getUTCDate());
  }
  datumText(s) { if (!this.istDatum(s)) return '–'; const p = s.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
  maxDatum(l) { const g = l.filter(x => this.istDatum(x)).sort(); return g.length ? g[g.length - 1] : null; }
  minDatum(l) { const g = l.filter(x => this.istDatum(x)).sort(); return g.length ? g[0] : null; }
  label(sp) { return { rot: 'Wareneingang', orange: 'In Bearbeitung', gruen: 'Ausgang', klaerung: 'Klärungsfall', archiv: 'Archiviert', storniert: 'Storniert' }[sp] || sp; }
  farbname(sp) { return { rot: 'ROT', orange: 'ORANGE', gruen: 'GRÜN', klaerung: 'KLÄRUNGSFALL', archiv: 'ARCHIVIERT', storniert: 'STORNIERT' }[sp] || sp; }
  farbe(sp) { return { rot: '#B8183A', orange: '#B05400', gruen: '#0E7A3E', klaerung: '#5B3FA8', archiv: '#5B6B7E', storniert: '#5B6B7E' }[sp] || '#0F2A4A'; }
  katLabel(k) { return { offen: 'offen', geschlossen: 'geschlossen', storniert: 'storniert (ignoriert)' }[k] || k; }

  // ===== Zentrale Statuslogik =====
  // Eine Karte pro Servicemeldung. Spalte wird bei jeder Aktualisierung komplett neu berechnet.
  bewerte(daten, cfg) {
    const smZ = cfg.statusZuordnung.servicemeldung, dsZ = cfg.statusZuordnung.dispatch;
    const sms = (daten && daten.servicemeldungen) || [], dss = (daten && daten.dispatches) || [];
    const anzahlNr = {};
    sms.forEach(sm => { if (sm && sm.nr) anzahlNr[sm.nr] = (anzahlNr[sm.nr] || 0) + 1; });
    const proSm = {}; const eintraege = [];
    dss.forEach(d => {
      if (d && d.smNr && anzahlNr[d.smNr]) (proSm[d.smNr] = proSm[d.smNr] || []).push(d);
      else eintraege.push(this.klaerungDispatch(d || {}, dsZ));
    });
    sms.forEach((sm, i) => eintraege.push(this.bewerteSm(sm || {}, i, proSm[sm && sm.nr] || [], anzahlNr, smZ, dsZ, cfg)));
    eintraege.sort((a, b) => {
      const x = a.wareneingang || '9999-99-99', y = b.wareneingang || '9999-99-99';
      return x < y ? -1 : x > y ? 1 : String(a.key).localeCompare(String(b.key));
    });
    const z = { rot: 0, orange: 0, gruen: 0, klaerung: 0, archiv: 0, storniert: 0 };
    eintraege.forEach(e => { z[e.spalte]++; });
    z.gesamt = z.rot + z.orange + z.gruen;
    return { eintraege, zaehler: z };
  }
  bewerteSm(sm, i, ds, anzahlNr, smZ, dsZ, cfg) {
    const dispatches = ds.map(d => Object.assign({}, d, { kat: dsZ[d.status] || null }))
      .sort((a, b) => String(a.erstellt || '').localeCompare(String(b.erstellt || '')) || String(a.nr).localeCompare(String(b.nr)));
    const smKat = smZ[sm.status] || null;
    const fehlend = [];
    if (!sm.nr) fehlend.push('Servicemeldungsnummer');
    if (!this.istDatum(sm.wareneingang)) fehlend.push('Wareneingangsdatum');
    if (!sm.geraet && !sm.modell) fehlend.push('Gerät/Modell');
    const unbekannt = dispatches.filter(d => !d.kat);
    const gueltig = dispatches.filter(d => d.kat && d.kat !== 'storniert');
    const offen = gueltig.filter(d => d.kat === 'offen');
    const zu = gueltig.filter(d => d.kat === 'geschlossen');
    let spalte, grund = null; const hinweise = [];
    if (sm.nr && anzahlNr[sm.nr] > 1) { spalte = 'klaerung'; grund = 'Servicemeldungsnummer mehrfach vorhanden'; }
    else if (!smKat) { spalte = 'klaerung'; grund = 'Unbekannter Servicemeldungs-Status „' + (sm.status || 'leer') + '“'; }
    else if (fehlend.length) { spalte = 'klaerung'; grund = 'Pflichtdaten fehlen: ' + fehlend.join(', '); }
    else if (unbekannt.length) { spalte = 'klaerung'; grund = 'Unbekannter Dispatch-Status: ' + unbekannt.map(d => d.nr + ' „' + (d.status || 'leer') + '“').join(', '); }
    else if (smKat === 'storniert') {
      if (offen.length) { spalte = 'klaerung'; grund = 'Servicemeldung storniert, aber Dispatch noch offen'; }
      else spalte = 'storniert';
    }
    else if (offen.length) {
      spalte = 'orange';
      if (smKat === 'geschlossen') hinweise.push('SM geschlossen – Dispatch offen');
      if (offen.length > 1) hinweise.push(offen.length + ' Dispatches offen');
    }
    else if (zu.length) {
      const abschluss = this.maxDatum(zu.map(d => d.abgeschlossen));
      if (!abschluss) { spalte = 'klaerung'; grund = 'Dispatch geschlossen, aber Abschlussdatum fehlt'; }
      else if (this.istDatum(sm.warenausgang)) { spalte = 'archiv'; grund = 'Warenausgang gebucht'; }
      else if (this.tageZwischen(abschluss, cfg.heute) > cfg.gruenAnzeigeTage) { spalte = 'archiv'; grund = 'Seit mehr als ' + cfg.gruenAnzeigeTage + ' Tagen abgeschlossen'; }
      else spalte = 'gruen';
    }
    else if (smKat === 'geschlossen') { spalte = 'klaerung'; grund = 'Servicemeldung geschlossen, aber kein Dispatch vorhanden'; }
    else spalte = 'rot';

    const zuSort = zu.slice().sort((a, b) => String(a.abgeschlossen || '').localeCompare(String(b.abgeschlossen || '')));
    const haupt = offen.length ? offen[offen.length - 1] : (zuSort.length ? zuSort[zuSort.length - 1] : (dispatches[dispatches.length - 1] || null));
    const fertig = spalte === 'gruen' || spalte === 'archiv';
    const we = this.istDatum(sm.wareneingang) ? sm.wareneingang : null;
    const wa = this.istDatum(sm.warenausgang) ? sm.warenausgang : null;
    return {
      key: (sm.nr && anzahlNr[sm.nr] === 1) ? sm.nr : (sm.nr || 'ohne-Nr') + '#' + i,
      typ: 'sm', smNr: sm.nr || '–', geraet: sm.geraet || '', modell: sm.modell || '',
      geraetText: [sm.geraet, sm.modell].filter(Boolean).join(' ') || '–',
      sn: sm.sn || '–', sw: sm.sw || '–', kunde: sm.kunde || '–', kontakt: sm.kontakt || '–', fehler: sm.fehler || '–',
      smStatus: sm.status || '–', smKat: smKat,
      wareneingang: we, standzeit: we ? this.tageZwischen(we, cfg.heute) : null,
      bearbeitungsbeginn: this.minDatum(gueltig.map(d => d.erstellt)),
      dispatchAbschluss: fertig ? this.maxDatum(zu.map(d => d.abgeschlossen)) : null,
      warenausgang: wa, standzeitAusgang: we && wa ? this.tageZwischen(we, wa) : null,
      spalte: spalte, grund: grund, hinweise: hinweise, dispatches: dispatches, offeneAnzahl: offen.length,
      haupt: haupt, dispatchNr: haupt ? haupt.nr : '–', techniker: haupt && haupt.techniker ? haupt.techniker : '–',
      unterstatus: haupt && haupt.kat === 'offen' && haupt.unterstatus ? haupt.unterstatus : '',
      abschlussgrund: fertig && haupt ? (haupt.abschlussgrund || 'ohne Angabe') : '',
      notizen: sm.notizen || []
    };
  }
  klaerungDispatch(d, dsZ) {
    return {
      key: 'DS:' + (d.nr || '?'), typ: 'ds', smNr: d.smNr || '–', geraet: '', modell: '', geraetText: '–', sn: '–', sw: '–', kunde: '–', kontakt: '–', fehler: '–',
      smStatus: '–', smKat: null, wareneingang: null, standzeit: null, bearbeitungsbeginn: this.istDatum(d.erstellt) ? d.erstellt : null,
      dispatchAbschluss: null, warenausgang: null, standzeitAusgang: null, spalte: 'klaerung',
      grund: 'Dispatch ohne zuordenbare Servicemeldung (Referenz: ' + (d.smNr || 'keine') + ')', hinweise: [],
      dispatches: [Object.assign({}, d, { kat: dsZ[d.status] || null })], offeneAnzahl: 0, haupt: d,
      dispatchNr: d.nr || '–', techniker: d.techniker || '–', unterstatus: '', abschlussgrund: '', notizen: []
    };
  }

  // ===== Demo-Datenquelle (synthetisch) =====
  demoDaten(h) {
    const t = n => this.minusTage(h, n);
    const F = {
      'SM-104201': 'Okklusionsalarm ohne erkennbare Ursache', 'SM-104202': 'Display flackert, SpO2-Kurve fällt aus',
      'SM-104203': 'Antrieb blockiert bei Bolusgabe', 'SM-104204': 'Ableitung V4 ohne Signal', 'SM-104205': 'Unterdruck wird nicht erreicht',
      'SM-104188': 'Ladefehler Akku, Selbsttest schlägt fehl', 'SM-104190': 'Druckalarm bei Exspiration', 'SM-104192': 'Tür-Sensor meldet offen',
      'SM-104193': 'Sensor wird nicht erkannt', 'SM-104195': 'NIBP-Messung bricht ab', 'SM-104196': 'Manschette pumpt nicht auf',
      'SM-104197': 'Spritzenerkennung fehlerhaft', 'SM-104170': 'Luftsensor löst Fehlalarm aus', 'SM-104172': 'Drucker zieht Papier nicht ein',
      'SM-104175': 'Motorgeräusch, Leistung zu gering', 'SM-104178': 'Elektrodenkabel-Erkennung defekt', 'SM-104160': 'Netzteil ohne Funktion',
      'SM-104199': 'Alarmlautsprecher zu leise'
    };
    const sm = (nr, geraet, modell, sn, sw, kunde, kontakt, eingang, status, extra) =>
      Object.assign({ nr, geraet, modell, sn, sw, kunde, kontakt, fehler: F[nr] || '', wareneingang: t(eingang), status, warenausgang: null, notizen: [] }, extra || {});
    const ds = (nr, smNr, status, techniker, unterstatus, erstellt, abgeschlossen, grund) =>
      ({ nr, smNr, status, techniker, unterstatus, erstellt: t(erstellt), abgeschlossen: abgeschlossen === null ? null : t(abgeschlossen), abschlussgrund: grund || null });
    const basis = {
      servicemeldungen: [
        sm('SM-104201', 'Infusionspumpe', 'IP-300', 'IP3-24-0412', '2.4.1', 'Klinik am Seepark', 'Fr. Brandl, Medizintechnik', 1, 'Aktiv'),
        sm('SM-104202', 'Patientenmonitor', 'PM-12', 'PM12-23-1187', '5.0.3', 'Rehazentrum Waldblick', 'Hr. Kovač, Haustechnik', 2, 'Aktiv'),
        sm('SM-104203', 'Spritzenpumpe', 'SP-20', 'SP20-22-0730', '1.9.2', 'Gesundheitszentrum Donaublick', 'Fr. Lechner, Stationsleitung', 2, 'Aktiv'),
        sm('SM-104204', 'EKG-Gerät', 'EK-8', 'EK8-21-0055', '3.2.0', 'Praxisgemeinschaft Lindengasse', 'Fr. Hofer, Ordination', 3, 'Aktiv'),
        sm('SM-104205', 'Absaugpumpe', 'AP-2', 'AP2-24-0901', '1.1.4', 'Pflegeheim Sonnenhof', 'Hr. Weiß, Einkauf', 0, 'Aktiv'),
        sm('SM-104188', 'Defibrillator', 'DF-5', 'DF5-20-0318', '4.0.7', 'Klinik am Seepark', 'Fr. Brandl, Medizintechnik', 9, 'Aktiv'),

  // ===== Simulierte CRM-Änderungen (verändern nur die Demo-Quelle) =====
  findeSm(q, nr) { return q.servicemeldungen.find(s => s.nr === nr); }
  naechsteNr(liste, praefix, start) {
    let max = start;
    liste.forEach(x => { const s = String(x.nr || ''); const m = s.match(/(\d+)$/); if (m && s.indexOf(praefix) === 0) max = Math.max(max, Number(m[1])); });
    return praefix + (max + 1);
  }
  offeneDs(q, nr, cfg) { const z = cfg.statusZuordnung.dispatch; return q.dispatches.filter(d => d.smNr === nr && z[d.status] === 'offen'); }
  mNeueSm(q, heute) {
    const v = [
      ['Infusionspumpe', 'IP-300', 'IP3-25', '2.4.1', 'Klinik am Seepark', 'Fr. Brandl, Medizintechnik'],

      ['EKG-Gerät', 'EK-8', 'EK8-25', '3.2.0', 'Praxisgemeinschaft Lindengasse', 'Fr. Hofer, Ordination'],
      ['Spritzenpumpe', 'SP-20', 'SP20-25', '1.9.2', 'Pflegeheim Sonnenhof', 'Hr. Weiß, Einkauf']
    ][q.servicemeldungen.length % 4];
    const nr = this.naechsteNr(q.servicemeldungen, 'SM-', 104200);
    q.servicemeldungen.push({ nr, geraet: v[0], modell: v[1], sn: v[2] + '-' + this.zwei(q.servicemeldungen.length) + '07', sw: v[3], kunde: v[4], kontakt: v[5], fehler: 'Gerät startet nicht (Demo-Eingang)', wareneingang: heute, status: 'Aktiv', warenausgang: null, notizen: [] });
    return nr;
  }
  mDispatchErstellen(q, nr, tech, heute) {
    const dnr = this.naechsteNr(q.dispatches, 'DS-', 55100);
    q.dispatches.push({ nr: dnr, smNr: nr, status: 'Zugewiesen', techniker: tech, unterstatus: 'Diagnose', erstellt: heute, abgeschlossen: null, abschlussgrund: null });
    return dnr;
  }
  mSmSchliessen(q, nr) { const s = this.findeSm(q, nr); if (s) s.status = 'Gelöst'; }
  mKvOffen(q, nr, cfg) { const o = this.offeneDs(q, nr, cfg); const d = o[o.length - 1]; if (d) { d.status = 'Warten auf Freigabe'; d.unterstatus = 'KV offen – Freigabe ausstehend'; } }
  mKvAbgelehnt(q, nr, cfg) {
    const s = this.findeSm(q, nr);
    if (s) s.notizen = (s.notizen || []).concat(['Kunden-E-Mail vom ' + this.datumText(cfg.heute) + ': Kostenvoranschlag abgelehnt']);
    const o = this.offeneDs(q, nr, cfg); const d = o[o.length - 1];
    if (d) { d.status = 'In Arbeit'; d.unterstatus = 'KV abgelehnt – Rückversand vorbereiten'; }
  }
  mDispatchSchliessen(q, nr, grund, cfg) {
    const o = this.offeneDs(q, nr, cfg); const d = o[o.length - 1];
    if (d) { d.status = 'Abgeschlossen'; d.abgeschlossen = cfg.heute; d.abschlussgrund = grund; d.unterstatus = ''; return d.nr; }
    return null;
  }
  mWiedereroeffnen(q, nr, cfg) {
    const z = cfg.statusZuordnung.dispatch;
    const zu = q.dispatches.filter(d => d.smNr === nr && z[d.status] === 'geschlossen')
      .sort((a, b) => String(a.abgeschlossen || '').localeCompare(String(b.abgeschlossen || '')));
    const d = zu[zu.length - 1];
    if (d) { d.status = 'In Arbeit'; d.abgeschlossen = null; d.abschlussgrund = null; d.unterstatus = 'Wiedereröffnet'; return d.nr; }
    return null;
  }
  mWarenausgang(q, nr, heute) { const s = this.findeSm(q, nr); if (s) s.warenausgang = heute; }
  mStorno(q, nr) { const s = this.findeSm(q, nr); if (s) s.status = 'Storniert'; }
  mFehlerhaft(q, heute) {
    const nr = this.naechsteNr(q.servicemeldungen, 'SM-', 104200);
    q.servicemeldungen.push({ nr, geraet: 'Spritzenpumpe', modell: 'SP-20', sn: 'SP20-25-0999', sw: '1.8.0', kunde: 'Klinik am Seepark', kontakt: 'Fr. Brandl, Medizintechnik', fehler: 'Unbekannt', wareneingang: heute, status: 'Neu (nicht zugeordnet)', warenausgang: null, notizen: [] });
    return nr;
  }

  // ===== Szenarien A–F =====
  szenario(q, b, cfg, tech) {
    const e = this.bewerte(q, cfg).eintraege;
    const or1 = x => x.spalte === 'orange' && x.offeneAnzahl === 1;
    if (b === 'A') { const nr = this.mNeueSm(q, cfg.heute); return { key: nr, text: 'Szenario A: Servicemeldung ' + nr + ' im Wareneingang erfasst' }; }
    if (b === 'B') {
      const z = e.find(x => x.spalte === 'rot'); if (!z) return null;
      const d = this.mDispatchErstellen(q, z.key, tech, cfg.heute);
      return { key: z.key, text: 'Szenario B: Dispatch ' + d + ' zu ' + z.smNr + ' erstellt, zugewiesen an ' + tech };
    }
    if (b === 'C') {
      const z = e.find(x => or1(x) && x.smKat === 'offen'); if (!z) return null;
      this.mSmSchliessen(q, z.key);
      return { key: z.key, text: 'Szenario C: Servicemeldung ' + z.smNr + ' geschlossen, Dispatch ' + z.dispatchNr + ' noch offen' };
    }
    if (b === 'D') {
      const z = e.find(x => or1(x) && x.smKat === 'geschlossen') || e.find(or1); if (!z) return null;
      const d = this.mDispatchSchliessen(q, z.key, 'Repariert', cfg);
      return { key: z.key, text: 'Szenario D: Dispatch ' + d + ' zu ' + z.smNr + ' geschlossen (repariert)' };
    }
    if (b === 'E') {
      const z = e.find(x => or1(x) && /KV offen/.test(x.unterstatus)) || e.find(x => or1(x) && x.smKat === 'offen'); if (!z) return null;
      this.mKvAbgelehnt(q, z.key, cfg); this.mSmSchliessen(q, z.key);
      const d = this.mDispatchSchliessen(q, z.key, 'KV abgelehnt', cfg);
      return { key: z.key, text: 'Szenario E: KV zu ' + z.smNr + ' abgelehnt (E-Mail in Notizen), SM und Dispatch ' + d + ' geschlossen' };
    }
    if (b === 'F') {
      const g = e.filter(x => x.spalte === 'gruen').sort((a, c) => String(c.dispatchAbschluss).localeCompare(String(a.dispatchAbschluss)));
      const z = g[0]; if (!z) return null;
      const d = this.mWiedereroeffnen(q, z.key, cfg);
      return { key: z.key, text: 'Szenario F: Dispatch ' + d + ' zu ' + z.smNr + ' wiedereröffnet' };
    }
    return null;
  }

  // ===== Simulierte Synchronisierung =====
  logEintrag(text, fehler) { return { zeit: this.uhr(Date.now()), text: text, fehler: !!fehler }; }
  nurLog(text, fehler) { this.setState({ log: [this.logEintrag(text, fehler)].concat(this.state.log).slice(0, 14) }); }
  commit(q, text, key) {
    const s = this.state, jetzt = Date.now(), cfg = this.cfg();
    let meldung = text;
    if (key) { const e = this.bewerte(q, cfg).eintraege.find(x => x.key === key); if (e) meldung += ' → ' + this.farbname(e.spalte); }
    const neu = [this.logEintrag(meldung, false)];
    const patch = { quelle: q, geaendert: key || null };
    if (s.verbindung) { patch.anzeige = this.klon(q); patch.letzterSync = jetzt; patch.letzterVersuch = jetzt; }
    else neu.unshift(this.logEintrag('Leitstand nicht synchronisiert – Verbindung unterbrochen', true));
    patch.log = neu.concat(s.log).slice(0, 14);
    this.setState(patch);
  }
  tick() {
    const s = this.state, cfg = this.cfg(), jetzt = Date.now();
    const patch = { jetzt: jetzt };
    if (jetzt - s.letzterVersuch >= cfg.syncIntervallSek * 1000) {
      patch.letzterVersuch = jetzt;
      if (s.verbindung) { patch.anzeige = this.klon(s.quelle); patch.letzterSync = jetzt; }
      else patch.log = [this.logEintrag('Synchronisierung fehlgeschlagen (Verbindung unterbrochen)', true)].concat(s.log).slice(0, 14);
    }
    if (Math.floor(jetzt / 1000) % cfg.seitenwechselSek === 0) patch.seitenTick = s.seitenTick + 1;
    this.setState(patch);
  }
  vollbild() {
    try {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
      else if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    } catch (e) { /* Vollbild nicht erlaubt */ }
    this.setState({ ansicht: 'tv', detail: null });
  }

  // ===== Kurznummer =====
  // Stabile Kurznummer = letzte 4 Ziffern der Servicemeldung. Sie bleibt von Rot bis Grün gleich.
  // Haben zwei Aufträge dieselben 4 Endziffern, wird für beide die volle Ziffernfolge gezeigt.
  kurzNummern(eintraege) {
    const ziffern = e => (String(e.smNr || '').match(/\d+/g) || ['']).join('');
    const kurz4 = z => z.slice(-4);
    const anzahl = {};
    eintraege.forEach(e => { const k = kurz4(ziffern(e)); if (k) anzahl[k] = (anzahl[k] || 0) + 1; });
    const map = {};
    eintraege.forEach(e => { const z = ziffern(e), k = kurz4(z); map[e.key] = !k ? '' : (anzahl[k] > 1 ? z : k); });
    return map;
  }

    const sekImZyklus = Math.floor(s.jetzt / 1000) % cfg.seitenwechselSek;

    const spalte = sp => {

    };
    const syncOk = (s.jetzt - s.letzterSync) <= cfg.syncIntervallSek * 2000 + 1500;
    const offeneStandzeiten = alle.filter(e => (e.spalte === 'rot' || e.spalte === 'orange') && e.standzeit !== null).map(e => e.standzeit);

      if (s.fTyp && e.geraet !== s.fTyp) return false;
      if (s.fKunde && e.kunde !== s.fKunde) return false;
      if (qs) { const t = [e.smNr, e.sn, e.geraetText].concat(e.dispatches.map(d => d.nr)).join(' ').toLowerCase(); if (t.indexOf(qs) < 0) return false; }
      return true;
    }).map(deko);
    const opt = (werte, alleText) => [{ v: '', l: alleText }].concat(werte.filter((w, i, a) => w && w !== '–' && a.indexOf(w) === i).sort().map(w => ({ v: w, l: w })));
    const setF = feld => ev => { const o = {}; o[feld] = ev && ev.target ? ev.target.value : ev; this.setState(o); };

    // Detailansicht
    const det = s.detail ? alle.find(e => e.key === s.detail) : null;
    const d = det ? deko(det) : { smNr: '', spalteLabel: '', spalteFarbe: '#0F2A4A', hatGrund: false, hatHinweis: false, grund: '', hinweisText: '' };
    const felder = det ? [
      ['Kurznummer', kurzMap[det.key] || '–'],

      ['Dispatchnummer', det.dispatches.length ? det.dispatches.map(x => x.nr).join(', ') : 'noch kein Dispatch'],

      ['Seriennummer', det.sn], ['Softwareversion', det.sw],
      ['Fehlerbeschreibung', det.fehler],
      ['Kunde', cfg.kundeAufTv ? det.kunde : 'nicht für den TV freigegeben'],
      ['Wareneingangsdatum', this.datumText(det.wareneingang)],
      ['Standzeit seit Wareneingang', d.standzeitText],

      ['Abschlussgrund', det.abschlussgrund || '–'],
      ['Warenausgang', det.warenausgang ? this.datumText(det.warenausgang) : 'noch nicht gebucht'],
      ['Standzeit bis Warenausgang', det.standzeitAusgang === null ? 'nicht berechenbar (Warenausgang fehlt)' : det.standzeitAusgang + ' Tage']
    ].map(f => ({ l: f[0], v: f[1] })) : [];
    const nr = det && det.typ === 'sm' && det.key === det.smNr ? det.key : null;
    const akt = (fn, text) => () => { if (!nr) return; const q = this.klon(this.state.quelle); fn(q); this.commit(q, text, nr); };

    const szen = b => () => {
      const q = this.klon(this.state.quelle);
      const r = this.szenario(q, b, cfg, this.state.simTech);
      if (!r) { this.nurLog('Szenario ' + b + ': kein passender Auftrag vorhanden', true); return; }
      this.commit(q, r.text, r.key); this.setState({ detail: null });
    };
    const mapListe = m => Object.keys(m).map(w => ({ w: w, k: this.katLabel(m[w]) }));

    return {
      z: z, rot: spalte('rot'), orange: spalte('orange'), gruen: spalte('gruen'),
      istTv: istTv, istAdmin: istAdmin,
      tvBg: istTv ? '#0A2A5E' : 'transparent', tvFg: istTv ? '#FFFFFF' : '#0F2A4A',
      adBg: istAdmin ? '#0A2A5E' : 'transparent', adFg: istAdmin ? '#FFFFFF' : '#0F2A4A',
      zeigeTv: () => this.setState({ ansicht: 'tv', detail: null }), zeigeAdmin: () => this.setState({ ansicht: 'admin' }),
      vollbild: () => this.vollbild(),
      syncOk: syncOk, syncVeraltet: !syncOk, syncZeit: this.uhr(s.letzterSync),
      datumHeute: this.datumText(cfg.heute), uhrJetzt: this.uhr(s.jetzt), uhrHM: this.uhr(s.jetzt).slice(0, 5),
      hatKlaerung: z.klaerung > 0,
      kundeKopf: cfg.kundeAufTv ? 'KUNDE' : '',
      laengsteText: laengste === null ? '–' : (laengste === 1 ? '1 Tag' : laengste + ' Tage'),

      suche: s.suche, fStatus: s.fStatus, fTech: s.fTech, fTyp: s.fTyp, fKunde: s.fKunde, simTech: s.simTech,
      onSuche: setF('suche'), onStatus: setF('fStatus'), onTech: setF('fTech'), onTyp: setF('fTyp'), onKunde: setF('fKunde'), onSimTech: setF('simTech'),
      statusOptionen: [
        { v: 'aktiv', l: 'Alle auf dem TV' }, { v: 'rot', l: 'Wareneingang' }, { v: 'orange', l: 'In Bearbeitung' }, { v: 'gruen', l: 'Ausgang' },
        { v: 'klaerung', l: 'Klärungsfälle' }, { v: 'archiv', l: 'Archiviert' }, { v: 'storniert', l: 'Storniert' }, { v: 'alle', l: 'Alle Datensätze' }
      ],
      techOptionen: opt(alle.map(e => e.techniker), 'Alle Techniker'),
      typOptionen: opt(alle.map(e => e.geraet), 'Alle Gerätetypen'),
      kundeOptionen: opt(alle.map(e => e.kunde), 'Alle Kunden'),
      simTechOptionen: this.techniker().map(t => ({ v: t, l: t })),
      treffer: treffer, trefferText: treffer.length + (treffer.length === 1 ? ' Auftrag' : ' Aufträge') + ' gefunden',
      zeigeKlaerung: () => this.setState({ fStatus: 'klaerung', suche: '', fTech: '', fTyp: '', fKunde: '' }),

      szA: szen('A'), szB: szen('B'), szC: szen('C'), szD: szen('D'), szE: szen('E'), szF: szen('F'),
      verbindungText: s.verbindung ? 'Verbindung unterbrechen' : 'Verbindung wiederherstellen',
      verbindungUmschalten: () => {
        const st = this.state, jetzt = Date.now();
        if (st.verbindung) this.setState({ verbindung: false, log: [this.logEintrag('Verbindung zur Datenquelle unterbrochen (simuliert)', true)].concat(st.log).slice(0, 14) });
        else this.setState({ verbindung: true, anzeige: this.klon(st.quelle), letzterSync: jetzt, letzterVersuch: jetzt, log: [this.logEintrag('Verbindung wiederhergestellt – synchronisiert', false)].concat(st.log).slice(0, 14) });
      },
      jetztSync: () => {
        const st = this.state, jetzt = Date.now();
        if (!st.verbindung) { this.nurLog('Synchronisierung fehlgeschlagen (Verbindung unterbrochen)', true); return; }
        this.setState({ anzeige: this.klon(st.quelle), letzterSync: jetzt, letzterVersuch: jetzt, log: [this.logEintrag('Manuell synchronisiert', false)].concat(st.log).slice(0, 14) });
      },
      fehlerhaft: () => { const q = this.klon(this.state.quelle); const n = this.mFehlerhaft(q, cfg.heute); this.commit(q, 'Datensatz ' + n + ' mit unbekanntem Status „Neu (nicht zugeordnet)“ empfangen', n); },
      zuruecksetzen: () => {
        const daten = this.demoDaten(cfg.heute), jetzt = Date.now();
        this.setState({ quelle: daten, anzeige: this.klon(daten), letzterSync: jetzt, letzterVersuch: jetzt, verbindung: true, detail: null, geaendert: null, log: [this.logEintrag('Demo zurückgesetzt', false)] });
      },
      ausstehend: JSON.stringify(s.quelle) !== JSON.stringify(s.anzeige),
      log: s.log.map(l => ({ zeit: l.zeit, text: l.text, farbe: l.fehler ? '#B05400' : '#0F2A4A' })),
      zuordnungSm: mapListe(cfg.statusZuordnung.servicemeldung), zuordnungDs: mapListe(cfg.statusZuordnung.dispatch),
      gruenTage: cfg.gruenAnzeigeTage,

      detailOffen: !!det, d: d, felder: felder, schliessen: () => this.setState({ detail: null }),
      dispatchListe: det ? det.dispatches.map(x => ({ nr: x.nr || '–', status: x.status || '–', techniker: x.techniker || '–',
        info: x.abgeschlossen ? 'geschlossen ' + this.datumText(x.abgeschlossen) + (x.abschlussgrund ? ' · ' + x.abschlussgrund : '') : (x.unterstatus || '') })) : [],
      keineDispatches: !!det && det.dispatches.length === 0,
      hatNotizen: !!det && det.notizen.length > 0, notizen: det ? det.notizen.map(n => ({ text: n })) : [],
      zeigeAktionen: !!nr,
      aRot: !!det && det.spalte === 'rot', aOrange: !!det && det.spalte === 'orange',
      aSmOffen: !!det && det.spalte === 'orange' && det.smKat === 'offen', aGruen: !!det && det.spalte === 'gruen',
      aStornierbar: !!nr && det.smKat !== 'storniert' && det.spalte !== 'archiv',
      aDispatch: akt(q => this.mDispatchErstellen(q, nr, this.state.simTech, cfg.heute), 'Dispatch zu ' + nr + ' erstellt (' + s.simTech + ')'),
      aSmSchliessen: akt(q => this.mSmSchliessen(q, nr), 'Servicemeldung ' + nr + ' geschlossen'),
      aKvOffen: akt(q => this.mKvOffen(q, nr, cfg), 'KV zu ' + nr + ' erstellt, Freigabe ausstehend'),
      aKvAbgelehnt: akt(q => this.mKvAbgelehnt(q, nr, cfg), 'KV zu ' + nr + ' abgelehnt, E-Mail in Notizen'),
      aSchliessenRep: akt(q => this.mDispatchSchliessen(q, nr, 'Repariert', cfg), 'Dispatch zu ' + nr + ' geschlossen (repariert)'),
      aSchliessenNicht: akt(q => this.mDispatchSchliessen(q, nr, 'Nicht reparierbar', cfg), 'Dispatch zu ' + nr + ' geschlossen (nicht reparierbar)'),
      aSchliessenKv: akt(q => this.mDispatchSchliessen(q, nr, 'KV abgelehnt', cfg), 'Dispatch zu ' + nr + ' geschlossen (KV abgelehnt)'),
      aWeitererDs: akt(q => this.mDispatchErstellen(q, nr, this.state.simTech, cfg.heute), 'Weiterer Dispatch zu ' + nr + ' angelegt'),
      aReopen: akt(q => this.mWiedereroeffnen(q, nr, cfg), 'Dispatch zu ' + nr + ' wiedereröffnet'),
      aWarenausgang: akt(q => this.mWarenausgang(q, nr, cfg.heute), 'Warenausgang zu ' + nr + ' gebucht'),
      aStorno: akt(q => this.mStorno(q, nr), 'Servicemeldung ' + nr + ' storniert')
    };
  }
}

// ===== Darstellung =====
const app = new Component({});
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const neu = c => c.rahmen && c.rahmen.indexOf('#0B5CAD') >= 0 ? ' neu' : '';
function kopfSpalte(nr, titel, sub, farbe, schrift, zahlFarbe, anzahl, sp, spur, fuell) {
  return '<div class="skopf" style="background:' + farbe + ';color:' + schrift + '"><span class="nr">' + nr + '</span><div class="tx"><h2>' + titel + '</h2><div class="st">' + sub + '</div></div>'
    + (sp.mehrSeiten ? '<span class="seite">' + esc(sp.seiteKurz) + '</span>' : '')
    + '<span class="anz" style="color:' + zahlFarbe + '">' + anzahl + '</span></div>'
    + '<div class="balken" style="background:' + spur + '"><div style="width:' + sp.fortschritt + ';background:' + fuell + '"></div></div>';
}
function kRot(c, v) {
  return '<button type="button" class="karte' + neu(c) + '" data-key="' + esc(c.key) + '"><div class="reihe"><span class="badge">' + esc(c.kurz) + '</span><div class="inhalt">'
    + '<div class="zeile1"><span class="gross" style="color:#9B1B33">' + esc(c.smNr) + '</span><div class="rechts"><div class="lab">Eingang</div><div class="wert">' + esc(c.wareneingangText) + '</div></div></div>'
    + '<div class="raster r3"><div><div class="lab">Gerät</div><div class="wert">' + esc(c.geraetText) + '</div></div><div><div class="lab">Seriennummer</div><div class="wert n">' + esc(c.sn) + '</div></div>'
    + (c.zeigeKunde ? '<div><div class="lab">Kunde</div><div class="wert n">' + esc(c.kunde) + '</div></div>' : '') + '</div></div></div></button>';
}
function kOrange(c) {
  return '<button type="button" class="karte' + neu(c) + '" data-key="' + esc(c.key) + '"><div class="reihe"><span class="badge">' + esc(c.kurz) + '</span><div class="inhalt">'
    + '<div class="zeile1"><div style="display:flex;align-items:baseline;gap:.4em;min-width:0"><span class="dtag">DISPATCH</span><span class="gross" style="color:#8A4B0B">' + esc(c.dispatchNr) + '</span></div>'
    + '<div class="rechts" style="min-width:0;flex:0 1 auto;max-width:48%"><div class="wert">' + esc(c.techniker) + '</div><div class="lab" style="font-weight:600;color:' + c.statusFarbe + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(c.statusZeile) + '</div></div></div>'
    + '<div class="raster r4"><div><div class="lab">Servicemeldung</div><div class="wert mono">' + esc(c.smNr) + '</div></div><div><div class="lab">Gerät</div><div class="wert">' + esc(c.geraetText) + '</div></div>'
    + '<div><div class="lab">Seriennummer</div><div class="wert n">' + esc(c.sn) + '</div></div><div><div class="lab">Begonnen</div><div class="wert">' + esc(c.beginnText) + '</div></div></div></div></div></button>';
}
function kGruen(c) {
  return '<button type="button" class="karte g' + neu(c) + '" data-key="' + esc(c.key) + '"><div class="reihe"><span class="badge ds">' + esc(c.dispatchNr) + '</span><div class="inhalt">'
    + '<div style="display:flex;align-items:center;gap:.8em"><div class="raster r2" style="flex:1 1 auto;min-width:0">'
    + '<div><div class="lab">Servicemeldung</div><div class="wert mono" style="font-size:.74em;color:#0E6B37">' + esc(c.smNr) + '</div></div>'
    + '<div><div class="lab">Abschluss</div><div class="wert mono" style="font-size:.74em">' + esc(c.abschlussText) + '</div></div></div>'
    + '<div class="rechts" style="min-width:4.4em"><div class="mono" style="font-size:1.05em;font-weight:700;line-height:1;color:#0A2A5E;white-space:nowrap">' + esc(c.standzeit) + '<span style="font-size:.5em;font-weight:600"> Tage</span></div>'
    + '<div class="lab" style="font-weight:600;color:' + c.grundFarbe + ';white-space:nowrap">' + esc(c.abschlussgrund) + '</div></div></div></div></div></button>';
}
function zeichnen() {
  if (!app.state || !app.state.anzeige) return;
  const v = app.renderVals();
  const sp = (s, fn, cls, leer) => '<div class="liste ' + cls + '">' + (s.leer ? '<p class="leer">' + leer + '</p>' : s.karten.map(fn).join('')) + '</div>';
  let h = '<header class="kopf"><div class="marke"><div class="logo">LOGO</div><span class="firma">Dräger Austria <span>– Medizintechnik</span></span></div>'
    + '<div class="seg" role="group" aria-label="Ansicht"><button type="button" class="aktiv" data-akt="tv">TV-Ansicht</button><button type="button" data-akt="voll">Vollbild</button></div></header>'
    + '<section class="band"><div class="titel"><h1>Werkstatt im Blick</h1><span class="sub">Wareneingang · In Bearbeitung · Ausgang</span></div>'
    + '<div class="zeit"><span class="d">' + v.datumHeute + '</span><span class="u">' + v.uhrHM + '</span></div></section>'
    + (v.syncVeraltet ? '<div class="veraltet" role="alert">Daten veraltet – letzte erfolgreiche Aktualisierung ' + v.syncZeit + '</div>' : '')
    + '<main>'
    + '<section class="spalte" aria-label="Rot – Wareneingang">' + kopfSpalte('01', 'Wareneingang', 'Wartet auf einen Dispatch', '#B8183A', '#fff', '#9B1B33', v.z.rot, v.rot, '#F3D9DF', '#B8183A') + sp(v.rot, kRot, '', 'Keine offenen Wareneingänge') + '</section>'
    + '<section class="spalte" aria-label="Orange – In Bearbeitung">' + kopfSpalte('02', 'In Bearbeitung', 'Dispatch ist offen', '#FF9A2E', '#1A1F2B', '#8A4B0B', v.z.orange, v.orange, '#FFE6CC', '#D97A10') + sp(v.orange, kOrange, '', 'Keine aktiven Dispatches') + '</section>'
    + '<section class="spalte" aria-label="Grün – Ausgang">' + kopfSpalte('03', 'Ausgang / Abgeschlossen', 'Dispatch ist geschlossen', '#0E7A3E', '#fff', '#0E6B37', v.z.gruen, v.gruen, '#D3EBDD', '#0E7A3E') + sp(v.gruen, kGruen, 'g', 'Keine abgeschlossenen Aufträge') + '</section>'
    + '</main><footer><span>DEMO – synthetische Testdaten, keine Verbindung zu SAP oder Dynamics 365</span></footer>';
  if (v.detailOffen) {
    const d = v.d;
    h += '<div class="ov" data-akt="zu"><div class="dlg" role="dialog" aria-modal="true" aria-label="Auftragsdetails">'
      + '<div class="dkopf"><div><div class="ey">AUFTRAGSDETAILS</div><div style="display:flex;align-items:center;gap:.7em;flex-wrap:wrap;margin-top:.15em"><h2>' + esc(d.smNr) + '</h2>'
      + '<span class="chip"><i style="background:' + d.spalteFarbe + '"></i>' + esc(d.spalteLabel) + '</span></div></div><button type="button" class="btn" data-akt="zu">Schließen</button></div><div class="dbody">'
      + (d.hatGrund ? '<p style="margin:0 0 .6em;color:#5B3FA8;font-weight:600">Grund: ' + esc(d.grund) + '</p>' : '')
      + (d.hatHinweis ? '<p style="margin:0 0 .6em;color:#8A4B0B;font-weight:600">Hinweis: ' + esc(d.hinweisText) + '</p>' : '')
      + '<div class="felder">' + v.felder.map(f => '<div><div class="l">' + esc(f.l) + '</div><div class="v">' + esc(f.v) + '</div></div>').join('') + '</div>'
      + '<h3>Dispatches</h3>' + (v.keineDispatches ? '<p style="margin:0;color:#5B6B7E">Noch kein Dispatch angelegt.</p>' : v.dispatchListe.map(x => '<div class="dsz"><b class="mono">' + esc(x.nr) + '</b><span>' + esc(x.status) + '</span><span style="color:#3D4F66">' + esc(x.techniker) + '</span><span style="color:#5B6B7E">' + esc(x.info) + '</span></div>').join(''))
      + (v.hatNotizen ? '<h3>CRM-Notizen</h3>' + v.notizen.map(n => '<p class="notiz">' + esc(n.text) + '</p>').join('') : '')
      + '</div></div></div>';
  }
  document.getElementById('app').innerHTML = h;
}
document.addEventListener('click', e => {
  const k = e.target.closest('[data-key]'); if (k) { app.setState({ detail: k.getAttribute('data-key') }); return; }
  const a = e.target.closest('[data-akt]'); if (!a) return;
  const akt = a.getAttribute('data-akt');
  if (akt === 'zu' && (e.target === a || a.tagName === 'BUTTON')) app.setState({ detail: null });
  if (akt === 'tv') app.setState({ ansicht: 'tv', detail: null });
  if (akt === 'voll') app.vollbild();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && app.state.detail) app.setState({ detail: null }); });
zeichnen();
app.componentDidMount();
</script>
</body>
</html>
